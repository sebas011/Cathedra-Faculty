[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # Formatter preserves long messages, SQL, and frozen-data keys.

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # FastAPI evaluates dependency/query declarations at registration.
"app/auth.py" = ["B008"]
