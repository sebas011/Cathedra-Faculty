name: Windows local release gates
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faculty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Locked backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r desktop/requirements-build.txt -c backend/constraints-win-py314.txt
      - name: Locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend dependency advisories
        run: npm audit --prefix frontend --audit-level=moderate
      - name: Python dependency advisories
        run: python desktop/check_dependency_advisories.py
      - name: Tests and packaged smoke gates
        shell: pwsh
        run: ./desktop/build-split-release.ps1 -Python (Get-Command python).Source
